[project]
name = "bookmarks-api"
version = "1.0.0"
description = "A RESTful JSON API to save, tag, search, and manage web bookmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # passlib reads bcrypt.__about__ which newer bcrypt removed; harmless.
    "ignore:.*error reading bcrypt version.*:UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be used as defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy mapped relationships use string forward-refs resolved via the
# registry; keep them quoted (they are not redundant here).
"app/models/*.py" = ["UP037"]
